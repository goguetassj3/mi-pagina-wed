<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Crear cuenta | Mundo de Videojuegos
    </title>

    <link rel="stylesheet"
          href="css/estilos.css">

</head>


<body>


<header class="encabezado">

    <div class="logo">

        🎮

        <span>
            Mundo de <strong>Videojuegos</strong>
        </span>

    </div>


    <nav class="menu-principal">

        <a href="index.html">
            Inicio
        </a>

        <a href="index.html#videojuegos">
            Videojuegos
        </a>

        <a href="login.html">
            Iniciar sesión
        </a>

    </nav>

</header>



<main class="formulario-pagina">


    <div class="formulario-contenedor">


        <div class="formulario-icono">
            👤
        </div>


        <h1>
            Crear cuenta
        </h1>


        <p class="formulario-subtitulo">

            Crea tu perfil para guardar
            tus videojuegos favoritos.

        </p>


        <form id="formRegistro">


            <div class="campo">

                <label for="registroNombre">
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="registroNombre"
                    placeholder="Tu nombre"
                    required>

            </div>



            <div class="campo">

                <label for="registroCorreo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="registroCorreo"
                    placeholder="ejemplo@correo.com"
                    required>

            </div>



            <div class="campo">

                <label for="registroPassword">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="registroPassword"
                    placeholder="Crea una contraseña"
                    minlength="4"
                    required>

            </div>



            <div class="campo">

                <label for="registroPassword2">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="registroPassword2"
                    placeholder="Repite tu contraseña"
                    minlength="4"
                    required>

            </div>



            <button
                type="submit"
                class="boton-formulario">

                Crear cuenta

            </button>


        </form>



        <p class="formulario-pie">

            ¿Ya tienes una cuenta?

            <a href="login.html">
                Inicia sesión
            </a>

        </p>



        <a
            href="index.html"
            class="volver">

            ← Volver al inicio

        </a>


    </div>

</main>



<footer>

    <p>

        © 2026 Mundo de Videojuegos

        <span>|</span>

        Todos los derechos reservados

    </p>

</footer>



<script>

document.getElementById("formRegistro")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const nombre =
        document.getElementById("registroNombre")
        .value
        .trim();


    const correo =
        document.getElementById("registroCorreo")
        .value
        .trim();


    const password =
        document.getElementById("registroPassword")
        .value;


    const password2 =
        document.getElementById("registroPassword2")
        .value;


    /* Comprobar contraseñas */

    if (password !== password2) {

        alert(
            "Las contraseñas no coinciden."
        );

        return;

    }


    /* Crear usuario */

    const usuario = {

        nombre: nombre,

        correo: correo,

        password: password

    };


    /* Guardar usuario */

    localStorage.setItem(
        "usuarioRegistrado",
        JSON.stringify(usuario)
    );


    /* También dejamos preparado el usuario */

    localStorage.setItem(
        "usuarioVideojuegos",
        JSON.stringify(usuario)
    );


    alert(
        "¡Cuenta creada correctamente!"
    );


    /* Ir a iniciar sesión */

    window.location.href =
        "login.html";

});

</script>


</body>

</html>
